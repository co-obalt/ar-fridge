<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AR Product View</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      model-viewer {
        position: fixed;
        inset: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .screen {
        width: 100%;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 32%),
          linear-gradient(180deg, #181818 0%, #050505 100%);
      }

      .panel {
        width: min(100%, 420px);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 34px;
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.5;
      }

      .actions {
        margin-top: 22px;
        display: grid;
        gap: 12px;
      }

      button {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 999px;
        padding: 14px 20px;
        background: #ffffff;
        color: #111111;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .secondary {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }

      .status {
        margin-top: 14px;
        min-height: 22px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.9);
      }
    </style>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
  </head>
  <body>
    <model-viewer
      id="viewer"
      src="./not-too-modern_fridge.glb"
      alt="Fridge AR model"
      ar
      ar-modes="scene-viewer webxr quick-look"
      ar-scale="fixed"
      ar-placement="floor"
      environment-image="neutral"
      reveal="auto"
    ></model-viewer>

    <main class="screen">
      <section class="panel">
        <h1>AR Product View</h1>
        <p>Open the product in your environment.</p>

        <div class="actions">
          <button id="launchAr" type="button">Open in AR</button>
          <button id="retry" class="secondary" type="button" hidden>Try Again</button>
        </div>

        <div id="status" class="status"></div>
      </section>
    </main>

    <script>
      const viewer = document.getElementById("viewer");
      const launchAr = document.getElementById("launchAr");
      const retry = document.getElementById("retry");
      const status = document.getElementById("status");
      const isIOS =
        /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isIOS) {
        viewer.setAttribute("ar-modes", "quick-look");
      }

      function setStatus(message, canRetry = false) {
        status.textContent = message;
        retry.hidden = !canRetry;
      }

      function isMobileDevice() {
        return /android|iphone|ipad|ipod/i.test(navigator.userAgent);
      }

      async function openAR() {
        if (typeof viewer.activateAR !== "function") {
          setStatus("AR launch is not available in this browser.", true);
          return;
        }

        launchAr.disabled = true;
        setStatus("Launching AR...");

        try {
          await viewer.activateAR();
          setStatus("If the session closes, try again.", true);
        } catch (error) {
          setStatus("AR did not open. Use mobile Chrome or Safari.", true);
        } finally {
          launchAr.disabled = false;
        }
      }

      viewer.addEventListener("load", () => {
        if (!isMobileDevice()) {
          setStatus("Open this page on a supported mobile device.", false);
          return;
        }

        if (!viewer.canActivateAR) {
          setStatus("AR is not available on this device or browser.", true);
          return;
        }

        setStatus("Ready.");
      });

      viewer.addEventListener("error", () => {
        setStatus("The model failed to load.", true);
      });

      viewer.addEventListener("ar-status", (event) => {
        if (event.detail.status === "failed") {
          setStatus("The AR session failed.", true);
        }
      });

      launchAr.addEventListener("click", openAR);
      retry.addEventListener("click", openAR);
    </script>
  </body>
</html>
